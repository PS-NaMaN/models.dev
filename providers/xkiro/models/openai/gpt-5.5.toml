# Sources: https://api.xkiro.com/v1/models (pricing, limits, capabilities)
base_model = "openai/gpt-5.5"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 4.5
output = 27
cache_read = 0.45

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image"]
