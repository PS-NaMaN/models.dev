# Sources: https://api.xkiro.com/v1/models (pricing, limits, capabilities)
base_model = "openai/gpt-5.4"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh"]

[cost]
input = 2.25
output = 13.5
cache_read = 0.225

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image"]
