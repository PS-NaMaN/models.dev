# Sources: https://api.xkiro.com/v1/models (pricing, limits, capabilities)
base_model = "openai/gpt-5.6-terra"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 1
output = 6
cache_read = 0.125

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image"]
