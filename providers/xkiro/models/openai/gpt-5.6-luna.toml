# Sources: https://api.xkiro.com/v1/models (pricing, limits, capabilities)
base_model = "openai/gpt-5.6-luna"
base_model_omit = ["limit.input"]

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 0.1
output = 0.6
cache_read = 0.05

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image"]
